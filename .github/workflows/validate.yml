name: Validate registry

# Runs on every pull request (and on pushes to main) so a malformed entry
# is caught before a mentor reviews it.
on:
  pull_request:
    paths:
      - registry.json
      - schema.json
      - scripts/validate.mjs
      - scripts/check-tls.mjs
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - .github/workflows/validate.yml
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up patched Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Check TLS certificate rejection
        run: npm run check:tls

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate registry.json
        run: npm run validate
